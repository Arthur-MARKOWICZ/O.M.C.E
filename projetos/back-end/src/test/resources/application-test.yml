# Banco H2 em memoria: sobe junto com a JVM dos testes, nao precisa de container.
# MODE=MySQL      -> dialeto compativel com o MySQL usado em producao
# NON_KEYWORDS=USER -> "user" e palavra reservada no H2, e a entidade User mapeia @Table(name="user")
# DB_CLOSE_DELAY=-1 -> mantem o banco vivo entre as conexoes do mesmo teste
spring:
  datasource:
    url: jdbc:h2:mem:omce_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=USER;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  # As migrations em db/migration sao SQL de MySQL (MODIFY COLUMN, auto_increment).
  # Nos testes o schema vem das entidades via ddl-auto, entao o Flyway fica desligado.
  flyway:
    enabled: false
  mail:
    host: localhost
    port: 3025
    username: test
    password: test
